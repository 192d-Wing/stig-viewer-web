name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable with clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  e2e:
    needs: [lint-and-build, backend]
    runs-on: ubuntu-latest

    env:
      # Skip the DISA sync scheduler in CI — keeps backend startup fast and
      # avoids depending on the external network.
      STIG_SYNC_INTERVAL_HOURS: "999999"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start dev stack
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then
              echo "backend healthy after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "frontend healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become healthy"
          docker compose logs frontend
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop dev stack
        if: always()
        run: docker compose down -v
