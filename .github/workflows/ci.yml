name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: "0.22.1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/target
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/Cargo.lock') }}

      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk

      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - run: trunk build --release

  e2e:
    needs: lint-and-build
    runs-on: ubuntu-latest

    env:
      # Skip the DISA sync scheduler in CI — keeps backend startup fast and
      # avoids depending on the external network.
      STIG_SYNC_INTERVAL_HOURS: "999999"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v3

      - name: Start dev stack
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then
              echo "backend healthy after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          # The first `trunk serve` compiles the wasm bundle from scratch.
          for i in $(seq 1 180); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "frontend healthy after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "Frontend did not become healthy"
          docker compose logs frontend
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop dev stack
        if: always()
        run: docker compose down -v
