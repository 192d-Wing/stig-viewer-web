name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: lint-and-build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stig_viewer
          POSTGRES_USER: stig
          POSTGRES_PASSWORD: stig_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stig -d stig_viewer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://stig:stig_local@localhost:5432/stig_viewer
      PORT: 8080
      DATA_DIR: data
      STIG_SYNC_INTERVAL_HOURS: 999999

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend
        run: cargo build
        working-directory: backend

      - name: Start backend
        run: cargo run &
        working-directory: backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 2
          done
          echo "Backend did not start" && exit 1

      - name: Start frontend
        run: npm run dev &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5173 && exit 0
            sleep 2
          done
          echo "Frontend did not start" && exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
