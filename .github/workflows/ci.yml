name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a new advisory against an unchanged lock file is noticed.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    env:
      TRUNK_VERSION: "0.22.1"

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable with clippy, rustfmt and the wasm target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: frontend

      - name: Install Trunk
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk

      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked
      # The frontend never signs or verifies (#66-#69); no crypto library may
      # reach the WebAssembly build.
      - name: Check the wasm dependency tree has no aws-lc or ring
        run: |
          tree=$(cargo tree --locked --target wasm32-unknown-unknown -e normal)
          ! grep -E '(^|[^A-Za-z0-9_-])(ring|aws-lc[A-Za-z-]*) v[0-9]' <<<"$tree"
      - run: trunk build --release --locked

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable with clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Cross-implementation check (#69): a bundle signed by this build with
      # fresh runtime keys must verify under Node's OpenSSL, with every negative
      # case rejected. Needs Node 24.7+ for ML-DSA.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify a fresh hybrid bundle with the independent Node verifier
        env:
          STIG_WRITE_TEST_VECTOR: ${{ runner.temp }}/hybrid-vector.json
        run: |
          cargo test --locked write_test_vector
          node ../scripts/verify-bundle.mjs vector "$STIG_WRITE_TEST_VECTOR"
      # The default build links the non-FIPS aws-lc-sys and never the FIPS module (#65).
      - name: Check the default build links aws-lc-sys and not aws-lc-fips-sys
        run: |
          tree=$(cargo tree --locked -e normal)
          grep -q aws-lc-sys <<<"$tree"
          ! grep -q aws-lc-fips-sys <<<"$tree"
      # TLS (reqwest, lettre) runs on rustls + aws-lc-rs, so ring must not be
      # in the normal graph; only the dev-only rcgen may use it (#215).
      - name: Check ring is not in the normal dependency graph
        run: |
          tree=$(cargo tree --locked -e normal --prefix none)
          ! grep -E '^ring v' <<<"$tree"
      # RustCrypto stays in the graph via openidconnect and sqlx, but this crate
      # must not call it directly: application crypto goes through src/crypto.
      - name: Check the backend has no direct RustCrypto dependency
        run: |
          tree=$(cargo tree --locked -e normal --depth 1)
          ! grep -E ' (sha2|hmac|rsa|ed25519-dalek) v' <<<"$tree"
      # sqlx::test creates a throwaway database per test, so the user must be
      # allowed to CREATE DATABASE (the image's POSTGRES_USER is a superuser).
      # The server lives only for this job, listens on loopback only, and gets
      # a password generated fresh for every run; nothing is stored in the repo.
      # The password travels in PGPASSWORD (which sqlx reads), not in the URL.
      - name: Start a throwaway Postgres with a random password
        env:
          DB_IMAGE: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=stig -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=stig_viewer \
            -p 127.0.0.1:5432:5432 "$DB_IMAGE"
          # Probe over TCP with a real login. The image first runs a temporary
          # server on the unix socket only while it initialises, then restarts;
          # a socket-level pg_isready can succeed against that temporary server
          # and let the tests start just before the restart drops them.
          ready=0
          for _ in $(seq 1 60); do
            if docker exec -e PGPASSWORD="$pw" ci-postgres \
                 psql -h 127.0.0.1 -U stig -d stig_viewer -tAc 'select 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "Postgres did not become ready" >&2; docker logs ci-postgres; exit 1; }
          {
            echo "PGPASSWORD=$pw"
            echo "DATABASE_URL=postgres://stig@127.0.0.1:5432/stig_viewer"
          } >> "$GITHUB_ENV"

      # In this repo `#[ignore]` means "needs Postgres"; run exactly those
      # tests against the server started above.
      - run: cargo test --locked -- --ignored

  # Enforces the `rust-version` declared in backend/Cargo.toml: the MSRV is
  # read from the manifest so the two cannot drift.
  backend-msrv:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared minimum Rust version
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          [ -n "$msrv" ] || { echo "no rust-version in backend/Cargo.toml" >&2; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - run: cargo "+$MSRV" check --locked --all-targets

  # Builds, lints and tests the backend with the `fips` feature (#70). The
  # AWS-LC FIPS module needs CMake, Go, Perl and a C compiler; the runner image has them.
  backend-fips:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable with clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Check the FIPS build toolchain
        run: cmake --version && go version && perl -v | head -2 && cc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      # `--no-default-features` drops `non-fips`, so only the FIPS module links.
      # rustls' `fips` feature also pulls aws-lc-sys into the build graph, but
      # it is compiled, not linked: the binary check below is the real test.
      - name: Check the FIPS build links aws-lc-fips-sys and has no ring
        run: |
          tree=$(cargo tree --locked --no-default-features --features fips -e normal --prefix none)
          grep -q '^aws-lc-fips-sys v' <<<"$tree"
          ! grep -E '^ring v' <<<"$tree"

      - run: cargo clippy --locked --no-default-features --features fips --all-targets -- -D warnings

      - run: cargo test --locked --no-default-features --features fips

      # Same cross-implementation check against the FIPS-module ML-DSA (#69).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify a fresh hybrid bundle with the independent Node verifier
        env:
          STIG_WRITE_TEST_VECTOR: ${{ runner.temp }}/hybrid-vector.json
        run: |
          cargo test --locked --no-default-features --features fips write_test_vector
          node ../scripts/verify-bundle.mjs vector "$STIG_WRITE_TEST_VECTOR"

      # The TLS tests also run with the post-quantum groups opted in.
      - name: TLS tests with the pending ML-KEM groups opted in
        env:
          STIG_FIPS_PENDING_ALGS: "X25519MLKEM768,ML-KEM-1024"
        run: cargo test --locked --no-default-features --features fips crypto::tls

      # The binary must contain the FIPS module's symbols and none of the
      # non-FIPS aws-lc-sys ones (which are built but not linked).
      - name: Check the FIPS binary links only the FIPS module
        run: |
          cargo build --locked --no-default-features --features fips
          bin=target/debug/stig-viewer-backend
          fips_syms=$(nm "$bin" | grep -cE ' _?aws_lc_fips_[0-9]' || true)
          plain_syms=$(nm "$bin" | grep -cE ' _?aws_lc_[0-9]' || true)
          echo "aws_lc_fips_* symbols: $fips_syms, aws_lc_* symbols: $plain_syms"
          [ "$fips_syms" -gt 0 ]
          [ "$plain_syms" -eq 0 ]

  # cargo-deny advisories, bans and sources (#215), config in deny.toml. The
  # release tarball is pinned by version and SHA-256. Also runs weekly so a new
  # advisory against an unchanged lock file is noticed.
  supply-chain:
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: "0.22.0"
      CARGO_DENY_SHA256: "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install cargo-deny (pinned, checksum verified)
        run: |
          f="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$f" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$f"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1
          install "$RUNNER_TEMP/cargo-deny/cargo-deny" "$HOME/.cargo/bin/cargo-deny"

      - name: Backend (default features)
        run: cargo deny --manifest-path backend/Cargo.toml --locked check advisories bans sources

      - name: Backend (fips feature)
        run: cargo deny --manifest-path backend/Cargo.toml --locked --no-default-features --features fips check advisories bans sources

      - name: Frontend (wasm32)
        run: cargo deny --manifest-path frontend/Cargo.toml --locked --target wasm32-unknown-unknown check advisories bans sources

  # Decides whether a pull request touches anything e2e exercises. Pushes to
  # main always run e2e, whatever changed.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Paths whose changes can affect the e2e suite.
          pattern='^(frontend/|backend/|e2e/|dev/|testdata/|docker-compose\.yml$|Dockerfile\.dev$|playwright\.config\.js$|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq "$pattern"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No app changes; e2e will be skipped."
          fi

  dev-scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Shellcheck dev scripts
        run: shellcheck backend/scripts/dev-entrypoint.sh scripts/verify-split-role-upgrade.sh

      - name: Dev entrypoint tests
        run: npm run test:scripts

  e2e:
    needs: [lint-and-build, backend, changes]
    # `changes` is skipped on pushes, so `!cancelled()` stops that skip from
    # skipping e2e; the build jobs must still have succeeded.
    if: >-
      !cancelled()
      && needs.lint-and-build.result == 'success'
      && needs.backend.result == 'success'
      && (github.event_name == 'push' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest

    env:
      # Skip the DISA sync scheduler in CI — keeps backend startup fast and
      # avoids depending on the external network.
      STIG_SYNC_INTERVAL_HOURS: "999999"
      # `interval` ticks once at start regardless of the period, so also turn
      # the sync-at-start off. The suite reads `edge` and `windows-10` from
      # the tracked seed (backend/seed/stigs), which compose copies into the
      # stig_data volume and indexes into the catalog at start.
      STIG_SYNC_ON_START: "false"
      # The suite authenticates with X-User-Id and drives /api/test/*; both
      # are opt-in on the backend. Set explicitly rather than relying on the
      # compose defaults.
      ALLOW_TEST_AUTH_HEADER: "true"
      STIG_ENABLE_TEST_ROUTES: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start dev stack
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then
              echo "backend healthy after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Assert startup applied the audit test-mode policy
        # Must run before Playwright: /api/test/reset truncates audit_events.
        # The SQL mirrors TEST_FLAG_SQL in backend/src/db_audit.rs and migration
        # 043. The flag alone can be set by the owner step in db_roles; only the
        # startup call to apply_test_maintenance_policy writes the system row,
        # so the row proves main.rs still applies the policy. `>= 1` because
        # cargo watch may have restarted the backend.
        run: |
          psql_q() {
            local sql="$1"
            docker compose exec -T postgres psql -U stig -d stig_viewer -tAc "$sql" | tr -d '[:space:]'
          }
          flag="$(psql_q "SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_db_role_setting s JOIN pg_catalog.pg_database d ON d.oid = s.setdatabase WHERE d.datname = pg_catalog.current_database() AND s.setrole = 0 AND 'stig.audit_allow_test_mode=on' = ANY (s.setconfig))")"
          rows="$(psql_q "SELECT count(*) FROM audit_events WHERE action = 'audit.test_mode_enabled' AND user_id IS NULL AND user_role = 'system'")"
          echo "flag=${flag} startup_rows=${rows}"
          if [ "$flag" != "t" ] || [ "${rows:-0}" -lt 1 ]; then
            echo "Startup did not apply the audit test-mode policy"
            docker compose logs backend
            exit 1
          fi

      - name: Wait for frontend
        run: |
          # The first `trunk serve` compiles the wasm bundle from scratch.
          for i in $(seq 1 180); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "frontend healthy after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "Frontend did not become healthy"
          docker compose logs frontend
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop dev stack
        if: always()
        run: docker compose down -v
