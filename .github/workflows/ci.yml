name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    env:
      TRUNK_VERSION: "0.22.1"

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable with clippy, rustfmt and the wasm target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: frontend

      - name: Install Trunk
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk

      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked
      - run: trunk build --release --locked

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable with clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # sqlx::test creates a throwaway database per test, so the user must be
      # allowed to CREATE DATABASE (the image's POSTGRES_USER is a superuser).
      # The server lives only for this job, listens on loopback only, and gets
      # a password generated fresh for every run; nothing is stored in the repo.
      # The password travels in PGPASSWORD (which sqlx reads), not in the URL.
      - name: Start a throwaway Postgres with a random password
        env:
          DB_IMAGE: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=stig -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=stig_viewer \
            -p 127.0.0.1:5432:5432 "$DB_IMAGE"
          # Probe over TCP with a real login. The image first runs a temporary
          # server on the unix socket only while it initialises, then restarts;
          # a socket-level pg_isready can succeed against that temporary server
          # and let the tests start just before the restart drops them.
          ready=0
          for _ in $(seq 1 60); do
            if docker exec -e PGPASSWORD="$pw" ci-postgres \
                 psql -h 127.0.0.1 -U stig -d stig_viewer -tAc 'select 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "Postgres did not become ready" >&2; docker logs ci-postgres; exit 1; }
          {
            echo "PGPASSWORD=$pw"
            echo "DATABASE_URL=postgres://stig@127.0.0.1:5432/stig_viewer"
          } >> "$GITHUB_ENV"

      # In this repo `#[ignore]` means "needs Postgres"; run exactly those
      # tests against the server started above.
      - run: cargo test --locked -- --ignored

  # Decides whether a pull request touches anything e2e exercises. Pushes to
  # main always run e2e, whatever changed.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Paths whose changes can affect the e2e suite.
          pattern='^(frontend/|backend/|e2e/|dev/|testdata/|docker-compose\.yml$|Dockerfile\.dev$|playwright\.config\.js$|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq "$pattern"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No app changes; e2e will be skipped."
          fi

  e2e:
    needs: [lint-and-build, backend, changes]
    # `changes` is skipped on pushes, so `!cancelled()` stops that skip from
    # skipping e2e; the build jobs must still have succeeded.
    if: >-
      !cancelled()
      && needs.lint-and-build.result == 'success'
      && needs.backend.result == 'success'
      && (github.event_name == 'push' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest

    env:
      # Skip the DISA sync scheduler in CI — keeps backend startup fast and
      # avoids depending on the external network.
      STIG_SYNC_INTERVAL_HOURS: "999999"
      # `interval` ticks once at start regardless of the period, so also turn
      # the sync-at-start off. The suite reads `edge` and `windows-10` from
      # the tracked seed (backend/seed/stigs), which compose copies into the
      # stig_data volume and indexes into the catalog at start.
      STIG_SYNC_ON_START: "false"
      # The suite authenticates with X-User-Id and drives /api/test/*; both
      # are opt-in on the backend. Set explicitly rather than relying on the
      # compose defaults.
      ALLOW_TEST_AUTH_HEADER: "true"
      STIG_ENABLE_TEST_ROUTES: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start dev stack
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then
              echo "backend healthy after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          # The first `trunk serve` compiles the wasm bundle from scratch.
          for i in $(seq 1 180); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "frontend healthy after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "Frontend did not become healthy"
          docker compose logs frontend
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop dev stack
        if: always()
        run: docker compose down -v
