services:
  keycloak:
    # Pinned to Keycloak 26.0.8 (multi-arch manifest-list digest, amd64 + arm64).
    # Refresh: curl -sI -H "Accept: application/vnd.oci.image.index.v1+json" \
    #   https://quay.io/v2/keycloak/keycloak/manifests/26.0 (docker-content-digest),
    # confirm the patch version in the image label org.opencontainers.image.version,
    # then update this comment and the digest. Dependabot also proposes bumps.
    image: quay.io/keycloak/keycloak:26.8@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev --import-realm
    ports:
      - "8081:8081"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /realms/stig-viewer/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost:8081\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: stig
      POSTGRES_PASSWORD: stig_local
      POSTGRES_DB: stig_viewer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stig -d stig_viewer"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot, idempotent: creates the restricted application role the backend
  # connects as (#84). `stig` stays the owner of every schema object and runs
  # the migrations (DATABASE_MIGRATION_URL); `stig_app` gets only the DML
  # grants the backend applies after migrating. Dev-only password.
  db-roles:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    restart: "no"
    environment:
      PGPASSWORD: stig_local
    depends_on:
      postgres:
        condition: service_healthy
    # podman-compose ignores depends_on conditions, so wait for postgres here.
    command:
      - sh
      - -c
      - |
        until pg_isready -h postgres -U stig -d stig_viewer; do sleep 1; done
        psql -h postgres -U stig -d stig_viewer -v ON_ERROR_STOP=1 <<'SQL'
        DO $$do$$ BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'stig_app') THEN
            CREATE ROLE stig_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'stig_local';
          END IF;
        END $$do$$;
        ALTER ROLE stig_app PASSWORD 'stig_local';
        SQL

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # host.docker.internal lets the backend container reach a server
    # bound on the host's loopback — needed for E2E specs that spin up
    # an HTTP capture server (e.g. the webhook HMAC spec).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The backend runs as the restricted `stig_app` role; the owner role
      # `stig` migrates at startup and applies the grants (see README, Database).
      # Dev-only: both roles share the local password, supplied through
      # PGPASSWORD (sqlx uses it when a URL carries none) so no URL embeds a
      # credential.
      DATABASE_URL: postgres://stig_app@postgres:5432/stig_viewer
      DATABASE_MIGRATION_URL: postgres://stig@postgres:5432/stig_viewer
      PGPASSWORD: stig_local
      PORT: "8080"
      RUST_LOG: info
      STIG_ENV: development
      # Hours between DISA sync runs; set to a huge number to effectively disable
      # (used by CI to keep startup fast and avoid hitting external URLs).
      STIG_SYNC_INTERVAL_HOURS: ${STIG_SYNC_INTERVAL_HOURS:-24}
      # Whether the first sync runs at boot (default) or one interval later.
      # CI sets it to false so the e2e run never contacts DISA.
      STIG_SYNC_ON_START: ${STIG_SYNC_ON_START:-true}
      # Mutable data (synced/uploaded STIGs, drafts, attachments, archives)
      # lives in the stig_data named volume, not in the git checkout. The
      # tracked backend/seed/stigs is a read-only seed: files missing from
      # the volume are copied in at start and existing ones are never
      # overwritten. Production leaves STIG_SEED_DIR unset.
      DATA_DIR: /data
      STIG_SEED_DIR: /app/seed/stigs
      # OIDC config. Two URLs because the IdP is reached on two networks:
      #   OIDC_INTERNAL_URL — backend-to-Keycloak via the docker network.
      #                       Used for discovery, token exchange, JWKS fetch.
      #   OIDC_PUBLIC_URL   — Keycloak as the browser sees it on the host.
      #                       Used to rewrite the auth-endpoint URL we redirect
      #                       the user to, and as the expected token issuer.
      # Override either from the shell to point at a different IdP, e.g.:
      #   OIDC_INTERNAL_URL=https://idp.example.com/realms/foo \
      #   OIDC_PUBLIC_URL=https://idp.example.com \
      #   docker compose up
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://keycloak:8081/realms/stig-viewer}
      OIDC_PUBLIC_URL:   ${OIDC_PUBLIC_URL:-http://localhost:8081}
      OIDC_CLIENT_ID:    ${OIDC_CLIENT_ID:-stig-viewer-app}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-only-not-a-real-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/auth/callback}
      FRONTEND_URL: ${VITE_API_URL_FRONTEND:-http://localhost:5173}
      # Test-only hooks, both off unless set to "true"/"1". This dev stack
      # turns them on because the Playwright suite needs them. Production
      # deployments MUST leave both unset; the backend refuses to start if
      # either is on while STIG_ENV=production.
      #   ALLOW_TEST_AUTH_HEADER  — accept X-User-Id in place of a session.
      #   STIG_ENABLE_TEST_ROUTES — mount the unauthenticated /api/test/*
      #                             routes (DB reset, role changes, ...).
      #                             Also flags the DB for audit `test` mode: the owner
      #                             role (DATABASE_MIGRATION_URL) sets the flag and must be a
      #                             superuser or hold GRANT SET ON
      #                             PARAMETER stig.audit_allow_test_mode (PG 15+).
      #                             The flag persists; with routes off the backend
      #                             refuses to start until ALTER DATABASE <db>
      #                             RESET stig.audit_allow_test_mode.
      ALLOW_TEST_AUTH_HEADER: ${ALLOW_TEST_AUTH_HEADER:-true}
      STIG_ENABLE_TEST_ROUTES: ${STIG_ENABLE_TEST_ROUTES:-true}
      CARGO_TARGET_DIR: /target
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_target:/target
      - stig_data:/data
      - cargo_registry:/usr/local/cargo/registry
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    # podman-compose does not wait for db-roles to finish, so retry the owner
    # step (`migrate`: migrations + grants) while it exits 75 (retryable:
    # database unreachable or stig_app not created yet). Any other exit code is
    # permanent (checksum mismatch, planted object, bad credentials, compile
    # error) and stops the container at once instead of retrying 30 times.
    # `migrate` already ran the owner step, so the FIRST serve blanks
    # DATABASE_MIGRATION_URL and only verifies; later cargo-watch restarts keep
    # the URL, so a newly added migration is still applied on reload.
    command:
      - sh
      - -c
      - |
        n=0
        while true; do
          cargo run -- migrate
          rc=$$?
          if [ "$$rc" -eq 0 ]; then break; fi
          if [ "$$rc" -ne 75 ]; then echo "migrate failed permanently (exit $$rc)" >&2; exit "$$rc"; fi
          n=$$((n + 1))
          if [ "$$n" -ge 30 ]; then echo "migrate failed 30 times; giving up" >&2; exit 1; fi
          echo "waiting for db-roles / postgres (attempt $$n)"; sleep 2
        done
        touch /tmp/owner-step-done
        exec cargo watch -w src -w migrations -w Cargo.toml -w Cargo.lock -w stig-sources.toml -s 'if [ -e /tmp/owner-step-done ]; then rm -f /tmp/owner-step-done; exec env DATABASE_MIGRATION_URL= cargo run; else exec cargo run; fi'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # Backend origin compiled into the wasm bundle. Override from the host
      # shell to point at a non-localhost backend, e.g.:
      #   API_URL=http://192.168.1.5:8080 docker compose up
      # (VITE_API_URL is still honoured for existing setups.)
      API_URL: ${API_URL:-${VITE_API_URL:-http://localhost:8080}}
      # Bind mounts don't deliver inotify events on every host; poll instead.
      TRUNK_WATCH_POLL: "true"
    ports:
      - "5173:5173"
    volumes:
      # Source is read-only: the image runs unprivileged and writes its build
      # output to the /target, /dist and /cargo paths it owns.
      - ./frontend:/app/frontend:ro
      - frontend_target:/target
      - frontend_cargo:/cargo
    command: trunk serve

volumes:
  postgres_data:
  stig_data:
  backend_target:
  frontend_target:
  frontend_cargo:
  cargo_registry:
