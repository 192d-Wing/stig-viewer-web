# SonarCloud automatic analysis settings.
#
# backend/seed/stigs holds DISA STIG content (generated JSON), not source code.
# Its check and fix text quotes DISA's own example configurations, including
# sample password hashes, which the secret and hash rules flag as false
# positives. The content is covered by the seed tests in
# backend/src/parser/mod.rs instead.
sonar.exclusions=backend/seed/**
