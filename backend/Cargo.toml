[package]
name    = "stig-viewer-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "stig-viewer-backend"
path = "src/main.rs"

[dependencies]
axum               = { version = "0.7", features = ["macros", "multipart"] }
tokio              = { version = "1", features = ["full"] }
tower-http         = { version = "0.6", features = ["cors"] }
http-body          = "1"
reqwest            = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
quick-xml          = "0.37"
zip                = { version = "9.6", default-features = false, features = ["deflate-flate2", "deflate64", "time"] }  # deflate-flate2 (not deflate) so the deflate engine stays miniz_oxide; it takes its backend from the flate2 = "1" below
sqlx               = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }
chrono             = { version = "0.4", features = ["serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
uuid               = { version = "1", features = ["v4", "v5"] }
openidconnect      = { version = "4", features = ["reqwest", "rustls-tls"], default-features = false }
axum-extra         = { version = "0.9", features = ["cookie"] }
url                = "2"
time               = "0.3"
pdf-writer         = "0.15"
sha2               = "0.10"
hmac               = "0.12"
hex                = "0.4"
csv                = "1"
base64             = "0.22"
flate2             = "1"
lettre             = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
rsa                = { version = "0.9", features = ["sha2"] }
x509-parser        = "0.16"
ed25519-dalek      = "2"

[dev-dependencies]
# Paused clocks for the request-body deadline tests.
tokio              = { version = "1", features = ["test-util"] }
rcgen              = "0.13"
# `oneshot` for router-level tests.
tower              = { version = "0.5", features = ["util"] }
# Keep this rsa on the same version as the main [dependencies] rsa.
rsa                = { version = "0.9", features = ["sha2", "getrandom"] }
