[package]
name    = "stig-viewer-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "stig_viewer_backend"
path = "src/lib.rs"

[[bin]]
name = "stig-viewer-backend"
path = "src/main.rs"

[dev-dependencies]
tower          = "0.5"
http-body-util = "0.1"
bytes          = "1"
tempfile       = "3"
reqwest        = { version = "0.12", features = ["rustls-tls", "json", "multipart"], default-features = false }

[dependencies]
axum               = { version = "0.7", features = ["macros", "multipart"] }
tokio              = { version = "1", features = ["full"] }
tower-http         = { version = "0.6", features = ["cors"] }
reqwest            = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
quick-xml          = "0.37"
zip                = "2"
sqlx               = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate", "json"] }
chrono             = { version = "0.4", features = ["serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow             = "1"
uuid               = { version = "1", features = ["v4"] }
metrics            = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
# ── Auth (OIDC relying party) ───────────────────────────────────────────────
openidconnect      = { version = "3", default-features = false, features = ["reqwest", "rustls-tls"] }
axum-extra         = { version = "0.9", features = ["cookie-private"] }
cookie             = "0.18"
url                = "2"
hex                = "0.4"
sha2               = "0.10"
base64             = "0.22"
time               = "0.3"
