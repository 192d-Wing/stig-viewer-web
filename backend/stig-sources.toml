# Curated DISA download manifest for the scheduled sync.
#
# DISA publishes a new file name for every release, so these URLs go stale; the
# sync logs a 404/410 as a "stale URL" warning naming the entry. To refresh:
# find the current name on https://www.cyber.mil/stigs/downloads, then check it
# with `curl -sI <url>` before editing.
#
# Ids match the ones the library import (POST /api/upload/library) derives from
# the ZIP name, so a synced STIG replaces the imported one instead of adding a
# duplicate. Exceptions kept on purpose: `windows-10` and `edge` are read by the
# e2e suite, and their URLs stay on the release the tracked seed holds.
# Not listed: Cisco IOS XE Router NDM (no current download name found).

[[stigs]]
id       = "windows-10"
title    = "Windows 10 STIG"
category = "Windows"
url      = "https://dl.dod.cyber.mil/wp-content/uploads/stigs/zip/U_MS_Windows_10_V2R9_STIG.zip"

