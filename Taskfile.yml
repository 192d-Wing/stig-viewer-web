# https://taskfile.dev
#
#   task          list the available tasks
#   task dev      stand up local dev: backend stack in containers + frontend on the host
#
# Works with either Docker or Podman; whichever is installed is used.
version: '3'

vars:
  ENGINE:
    sh: if command -v docker >/dev/null 2>&1; then echo docker; else echo podman; fi
  COMPOSE: '{{.ENGINE}} compose'
  API_URL: '{{.API_URL | default "http://localhost:8080"}}'

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  # ── Local dev ──────────────────────────────────────────────────────────────

  dev:
    desc: Stand up local dev (postgres, keycloak, backend in containers; frontend via trunk on :5173)
    cmds:
      - task: up
      - task: frontend

  dev:containers:
    desc: Run everything in containers, frontend included (foreground, Ctrl-C to stop)
    deps: [engine]
    cmds:
      - '{{.COMPOSE}} up'

  up:
    desc: Start postgres, keycloak and the backend in the background, and wait until the backend is ready
    deps: [engine]
    cmds:
      - '{{.COMPOSE}} up -d postgres keycloak backend'
      - task: wait
      - task: seed:admin

  wait:
    desc: Wait until the backend answers its health check (BACKEND_WAIT seconds, default 600)
    silent: true
    vars:
      BACKEND_URL: '{{.BACKEND_URL | default "http://localhost:8080"}}'
      BACKEND_WAIT: '{{.BACKEND_WAIT | default "600"}}'
    cmds:
      # The backend container compiles before it listens, so the containers
      # being "up" does not mean the API is reachable yet.
      - |
        url='{{.BACKEND_URL}}/api/health'
        limit={{.BACKEND_WAIT}}
        start=$(date +%s)
        printf 'Waiting for the backend at %s (first start compiles; this can take a few minutes) ' "$url"
        while :; do
          if curl -sf --max-time 3 "$url" >/dev/null 2>&1; then
            printf '\nBackend is ready after %ss → {{.BACKEND_URL}}\n' "$(( $(date +%s) - start ))"
            exit 0
          fi
          if [ "$(( $(date +%s) - start ))" -ge "$limit" ]; then
            printf '\nBackend did not answer within %ss. Last backend log lines:\n' "$limit" >&2
            {{.COMPOSE}} logs --tail 30 backend >&2 || true
            echo "Follow it with: task logs -- backend" >&2
            exit 1
          fi
          printf '.'
          sleep 2
        done

  seed:admin:
    desc: Make the dev user alice an admin in the local database (runs as part of 'task up')
    silent: true
    vars:
      # Fixed Keycloak user id for alice (dev/keycloak/stig-viewer-realm.json).
      # The backend keys users on (provider, sub), so the row can exist before
      # her first sign-in and survives a database reset.
      ALICE_SUB: c00677de-7425-4030-a5f0-860c7cc1edab
    cmds:
      # Dev database only: this goes through the compose project's postgres
      # container. Run after 'wait', so the migrations have created the table.
      - |
        {{.COMPOSE}} exec -T postgres psql -U stig -d stig_viewer -q -v ON_ERROR_STOP=1 -c "
          INSERT INTO users (id, display_name, email, sub, provider, role)
          VALUES ('{{.ALICE_SUB}}', 'Alice Author', 'alice@example.test', '{{.ALICE_SUB}}', 'oidc', 'admin')
          ON CONFLICT (provider, sub) DO UPDATE SET role = 'admin';" >/dev/null
        echo "Dev user alice (alice@example.test) has the admin role."

  frontend:
    desc: Serve the frontend with trunk on http://localhost:5173 (rebuilds on change)
    deps: [setup]
    dir: frontend
    env:
      API_URL: '{{.API_URL}}'
    cmds:
      # The backend only accepts browser requests from this exact origin
      # (FRONTEND_URL). Trunk also prints http://127.0.0.1:5173 and LAN
      # addresses; opening the app on those fails with "Cannot connect to backend".
      - cmd: echo "Open the app at http://localhost:5173 (not 127.0.0.1 or a LAN address)"
        silent: true
      - trunk serve

  down:
    desc: Stop the containers (data is kept)
    deps: [engine]
    cmds:
      - '{{.COMPOSE}} down'

  reset:
    desc: Stop the containers and drop the volumes (Postgres and the STIG data volume; the seed is re-copied on next start)
    deps: [engine]
    prompt: This deletes the local Postgres data and the dev STIG data volume. Continue?
    cmds:
      - '{{.COMPOSE}} down -v'

  status:
    desc: Show container status
    deps: [engine]
    cmds:
      - '{{.COMPOSE}} ps'

  logs:
    desc: "Follow container logs (one service: task logs -- backend)"
    deps: [engine]
    cmds:
      - '{{.COMPOSE}} logs -f {{.CLI_ARGS}}'

  # ── Checks ─────────────────────────────────────────────────────────────────

  lint:
    desc: Clippy for frontend and backend
    cmds:
      - cd frontend && cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - cd backend && cargo clippy --locked -- -D warnings

  test:
    desc: Unit tests for frontend and backend
    cmds:
      - cd frontend && cargo test
      - cd backend && cargo test --locked

  test:db:
    desc: Backend tests including the database-backed ones, against a throwaway Postgres on 127.0.0.1:55432
    deps: [engine]
    vars:
      DB_PORT: '{{.DB_PORT | default "55432"}}'
      DB_NAME: '{{.DB_NAME | default "stig-dbtest"}}'
      # Same digest-pinned image as CI.
      DB_IMAGE: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    cmds:
      - defer: '{{.ENGINE}} rm -f {{.DB_NAME}} >/dev/null 2>&1 || true'
      # Never point this at the dev database: sqlx::test creates and drops
      # _sqlx_test_* databases on whatever server DATABASE_URL names. The
      # container is ephemeral, test-only and loopback-only, and gets a password
      # generated fresh on every run (passed to sqlx through PGPASSWORD, not
      # in the URL), so no credential is stored in the repo.
      # Unlike CI (which runs only the ignored DB tests in a separate step),
      # this runs the whole suite, DB tests included.
      - |
        name={{.DB_NAME}}
        pw="$(openssl rand -hex 24)"
        cleanup() { {{.ENGINE}} rm -f "$name" >/dev/null 2>&1 || true; }
        # Reap a container leaked by an interrupted earlier run, and clean up
        # on any exit, including Ctrl-C and a half-failed `run`.
        cleanup
        trap cleanup EXIT
        {{.ENGINE}} run -d --rm --name "$name" \
          -e POSTGRES_USER=stig -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=stig_viewer \
          -p 127.0.0.1:{{.DB_PORT}}:5432 {{.DB_IMAGE}} >/dev/null
        # Probe over TCP with a real login: the image first runs a temporary
        # server on the unix socket only while it initialises, then restarts,
        # and a socket-level pg_isready can succeed against that one.
        ready=0
        for _ in $(seq 1 60); do
          if {{.ENGINE}} exec -e PGPASSWORD="$pw" "$name" \
               psql -h 127.0.0.1 -U stig -d stig_viewer -tAc 'select 1' >/dev/null 2>&1; then ready=1; break; fi
          sleep 1
        done
        [ "$ready" = 1 ] || { echo "Postgres did not become ready" >&2; exit 1; }
        cd backend
        PGPASSWORD="$pw" DATABASE_URL=postgres://stig@127.0.0.1:{{.DB_PORT}}/stig_viewer \
          cargo test --locked -- --include-ignored

  e2e:
    desc: "Playwright suite; needs 'task dev' running (extra args: task e2e -- e2e/02-library.spec.js)"
    deps: [node-modules]
    cmds:
      - npx playwright test {{.CLI_ARGS}}

  build:
    desc: Release build of the frontend into frontend/dist
    deps: [setup]
    dir: frontend
    env:
      API_URL: '{{.API_URL}}'
    cmds:
      - trunk build --release

  # ── Prerequisites ──────────────────────────────────────────────────────────

  setup:
    desc: Install the frontend toolchain (wasm target, trunk) if missing
    status:
      - rustup target list --installed | grep -q wasm32-unknown-unknown
      - command -v trunk
    cmds:
      - rustup target add wasm32-unknown-unknown
      - command -v trunk >/dev/null 2>&1 || cargo install trunk --locked

  node-modules:
    internal: true
    sources: [package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci

  engine:
    internal: true
    silent: true
    cmds:
      # Podman on macOS/Windows needs its VM running before compose can talk to it.
      - |
        if [ "{{.ENGINE}}" = podman ] && ! podman info >/dev/null 2>&1; then
          echo "Starting podman machine…"
          podman machine start 2>/dev/null || true
          # A machine can be listed as running while its socket is dead
          # (e.g. after the host sleeps); restart it in that case.
          if ! podman info >/dev/null 2>&1; then
            echo "Podman machine is unresponsive; restarting it…"
            podman machine stop
            podman machine start
          fi
        fi
