[package]
name    = "stig-viewer-frontend"
version = "3.0.0"
edition = "2021"

[dependencies]
yew                  = { version = "0.23", features = ["csr"] }
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
gloo-net             = { version = "0.8", default-features = false, features = ["http", "json"] }
gloo-timers          = { version = "0.4", features = ["futures"] }
gloo-events          = "0.3"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
serde-wasm-bindgen   = "0.6"
roxmltree            = "0.21"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "Clipboard", "DataTransfer",
  "Document", "DomRect", "DomStringList", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList",
  "FocusEvent", "FormData", "Headers", "History", "HtmlAnchorElement", "HtmlElement",
  "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent",
  "Location", "MouseEvent", "Navigator", "Node", "NodeList", "PopStateEvent", "Request",
  "RequestCredentials", "RequestInit", "RequestMode", "Response", "Storage", "Url",
  "UrlSearchParams", "Window", "console",
  "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest",
  "IdbTransaction", "IdbTransactionMode", "IdbVersionChangeEvent", "IdbObjectStoreParameters",
  "IdbKeyRange", "IdbCursorWithValue", "IdbCursor", "IdbIndex", "IdbIndexParameters",
]

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
